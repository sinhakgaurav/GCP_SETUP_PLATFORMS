# EnterWeU VM: Caddy owns 80 and 443. HAProxy stays on loopback.
# Elasticsearch, Mongo, and Kafka stay in the "full" profile. Their memory
# caps alone are larger than an e2-small, and a dead auth process makes nginx
# return 502 on /api/auth/login/. Auth serves HTTP only; seeding is a separate step.
# Requires Docker Compose v2.24 or newer for !override and !reset.

services:
  haproxy:
    ports: !override
      - "127.0.0.1:18080:80"
      - "127.0.0.1:18404:8404"
  elasticsearch:
    profiles: ["full"]
    mem_limit: 768m
  mongodb:
    profiles: ["full"]
    mem_limit: 320m
  kafka:
    profiles: ["full"]
    mem_limit: 480m
  zookeeper:
    profiles: ["full"]
    mem_limit: 200m
  kafka-ui:
    profiles: ["full"]
    mem_limit: 128m
  video_service:
    profiles: ["full"]
  ai_service:
    profiles: ["full"]
  search_service:
    profiles: ["full"]
  event_service:
    profiles: ["full"]
  document_service:
    profiles: ["full"]
  payment_service:
    profiles: ["full"]
  analytics_service:
    profiles: ["full"]
  calendar_service:
    profiles: ["full"]
  outbox_worker:
    profiles: ["full"]
  kb_feeder:
    profiles: ["full"]
  analysis_retrier:
    profiles: ["full"]
  auth_service:
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    environment:
      DATABASE_URL: postgresql://enterweu_user:${POSTGRES_PASSWORD}@pgbouncer:5432/enterweu_db
    depends_on: !reset
      - pgbouncer
      - redis
      - subscription_service
  user_service:
    environment:
      DATABASE_URL: postgresql://enterweu_user:${POSTGRES_PASSWORD}@pgbouncer:5432/enterweu_db
      TALENT_LEDGER_URL: postgresql://enterweu_user:${POSTGRES_TALENT_PASSWORD}@pgbouncer_talent:5432/enterweu_talent
    depends_on: !reset
      - pgbouncer
      - redis
      - pgbouncer_talent
      - subscription_service
  interview_service:
    environment:
      DATABASE_URL: postgresql://enterweu_user:${POSTGRES_PASSWORD}@pgbouncer:5432/enterweu_db
    depends_on: !reset
      - pgbouncer
      - redis
  subscription_service:
    command: ["sh", "-c", "python manage.py init_subscription_ledger --skip-copy || true; python manage.py seed_subscription_plans || true; exec python manage.py runserver 0.0.0.0:8000"]
    environment:
      DATABASE_URL: postgresql://enterweu_user:${POSTGRES_PASSWORD}@pgbouncer:5432/enterweu_db
      SUBSCRIPTION_LEDGER_URL: postgresql://enterweu_user:${POSTGRES_LEDGER_PASSWORD}@pgbouncer_ledger:5432/enterweu_subscriptions
      POSTGRES_ADMIN_URL: postgresql://enterweu_user:${POSTGRES_PASSWORD}@postgres:5432/enterweu_db
    depends_on: !reset
      - pgbouncer
      - redis
      - postgres
      - postgres_ledger
      - pgbouncer_ledger
  consultancy_service:
    command: ["sh", "-c", "python manage.py init_talent_ledger --skip-copy || true; exec python manage.py runserver 0.0.0.0:8000"]
    environment:
      DATABASE_URL: postgresql://enterweu_user:${POSTGRES_PASSWORD}@pgbouncer:5432/enterweu_db
      TALENT_LEDGER_URL: postgresql://enterweu_user:${POSTGRES_TALENT_PASSWORD}@pgbouncer_talent:5432/enterweu_talent
      POSTGRES_ADMIN_URL: postgresql://enterweu_user:${POSTGRES_PASSWORD}@postgres:5432/enterweu_db
    depends_on: !reset
      - pgbouncer
      - redis
      - postgres
      - postgres_talent
      - pgbouncer_talent
      - subscription_service
  admin_service:
    environment:
      DATABASE_URL: postgresql://enterweu_user:${POSTGRES_PASSWORD}@pgbouncer:5432/enterweu_db
      TALENT_LEDGER_URL: postgresql://enterweu_user:${POSTGRES_TALENT_PASSWORD}@pgbouncer_talent:5432/enterweu_talent
    depends_on: !reset
      - pgbouncer
      - redis
      - postgres
      - postgres_talent
      - pgbouncer_talent
      - subscription_service
  content_service:
    environment:
      DATABASE_URL: postgresql://enterweu_user:${POSTGRES_PASSWORD}@pgbouncer:5432/enterweu_db
    depends_on: !reset
      - pgbouncer
      - redis
  notification_service:
    environment:
      DATABASE_URL: postgresql://enterweu_user:${POSTGRES_PASSWORD}@pgbouncer:5432/enterweu_db
    depends_on: !reset
      - pgbouncer
      - redis
