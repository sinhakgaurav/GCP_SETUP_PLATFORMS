# EnterWeU VM: Caddy owns 80 and 443. HAProxy stays on loopback.
# Memory caps keep Elasticsearch, MongoDB, and Kafka from killing an e2-small.
# Requires Docker Compose v2.24 or newer for !override.

services:
  haproxy:
    ports: !override
      - "127.0.0.1:18080:80"
      - "127.0.0.1:18404:8404"
  elasticsearch:
    mem_limit: 768m
  mongodb:
    mem_limit: 320m
  kafka:
    mem_limit: 480m
  zookeeper:
    mem_limit: 200m
  kafka-ui:
    mem_limit: 128m
